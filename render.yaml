services:
  - type: web
    name: avarice-server
    runtime: node
    buildCommand: npm ci --include=dev && npm run db:generate
    startCommand: npm run start --workspace @avarice/server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20.19.0"
      - key: CLIENT_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  - type: web
    name: avarice-client
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: apps/client/dist
    envVars:
      - key: NODE_VERSION
        value: "20.19.0"
      - key: VITE_SERVER_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
